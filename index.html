<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDI Melody Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #222;
      max-width: 480px;
      margin: 2.5rem auto;
      padding: 0 1rem 3rem;
    }

    h1 { font-size: 1.3rem; margin-bottom: 1.5rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #555;
      margin: 1rem 0 0.3rem;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 0.9rem;
      background: white;
      appearance: none;
      -webkit-appearance: none;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #6c8ebf;
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    #scale-desc {
      font-size: 0.78rem;
      color: #888;
      font-style: italic;
      margin: 0.35rem 0 0;
      min-height: 1.2em;
    }

    /* ── Sections ── */
    .section {
      margin-top: 1.25rem;
      padding-top: 1.1rem;
      border-top: 1px solid #e8e8e8;
    }

    .section h2 {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #bbb;
      margin: 0 0 0.85rem;
    }

    /* ── Character sliders ── */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }

    .slider-row label {
      font-size: 0.8rem;
      font-weight: 400;
      color: #555;
      width: 138px;
      flex-shrink: 0;
      margin: 0;
    }

    .slider-row input[type="range"] {
      flex: 1;
      height: 4px;
      border: none;
      padding: 0;
      accent-color: #1a56db;
      cursor: pointer;
    }

    .slider-val {
      font-size: 0.78rem;
      color: #999;
      width: 2.6em;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Perpetual motion ── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .toggle-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #1a56db;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-row label {
      font-size: 0.85rem;
      color: #333;
      margin: 0;
      cursor: pointer;
    }

    #perpetualFields {
      display: none;
      margin-top: 0.5rem;
    }

    #normalFields {
      transition: opacity 0.15s;
    }

    /* ── Generate button ── */
    button#generate {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.75rem;
      background: #1a56db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button#generate:hover:not(:disabled) { background: #1344b0; }

    button#generate:disabled {
      opacity: 0.6;
      cursor: default;
    }

    /* ── Output ── */
    #output {
      margin-top: 1rem;
      font-size: 0.82rem;
      color: #555;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <h1>MIDI Melody Generator</h1>

  <div class="row">
    <div>
      <label for="root">Root note</label>
      <select id="root"></select>
    </div>
    <div>
      <label for="timeSig">Time signature</label>
      <select id="timeSig">
        <option value="4/4">4/4</option>
        <option value="3/4">3/4</option>
        <option value="6/8">6/8</option>
        <option value="2/4">2/4</option>
        <option value="5/4">5/4</option>
        <option value="7/8">7/8</option>
      </select>
    </div>
  </div>

  <label for="scale">Scale</label>
  <select id="scale"></select>
  <p id="scale-desc"></p>

  <div class="row">
    <div>
      <label for="bars">Length (bars, 1–16)</label>
      <input type="number" id="bars" min="1" max="16" value="8" />
    </div>
    <div>
      <label for="bpm">Tempo (BPM)</label>
      <input type="number" id="bpm" min="40" max="240" value="120" />
    </div>
  </div>

  <div class="row">
    <div>
      <label for="cadence">Ending cadence</label>
      <select id="cadence">
        <option value="authentic">Authentic (V → I)</option>
        <option value="plagal">Plagal (IV → I)</option>
        <option value="half">Half (→ V)</option>
        <option value="deceptive">Deceptive (V → vi)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <h2>Character</h2>

    <div id="normalFields">
      <div class="slider-row">
        <label for="density">Note density</label>
        <input type="range" id="density" min="0" max="1" step="0.01" value="0.65" />
        <span class="slider-val" id="densityVal">0.65</span>
      </div>

      <div class="slider-row">
        <label for="syncop">Syncopation</label>
        <input type="range" id="syncop" min="0" max="1" step="0.01" value="0.25" />
        <span class="slider-val" id="syncopVal">0.25</span>
      </div>

      <div class="slider-row">
        <label for="repetition">Repetition</label>
        <input type="range" id="repetition" min="0" max="1" step="0.01" value="0.50" />
        <span class="slider-val" id="repetitionVal">0.50</span>
      </div>

      <div class="slider-row">
        <label for="variation">Variation</label>
        <input type="range" id="variation" min="0" max="1" step="0.01" value="0.25" />
        <span class="slider-val" id="variationVal">0.25</span>
      </div>
    </div>

    <div class="slider-row">
      <label for="stepWeight">Stepwise motion</label>
      <input type="range" id="stepWeight" min="0" max="1" step="0.01" value="0.75" />
      <span class="slider-val" id="stepVal">0.75</span>
    </div>

    <div class="slider-row">
      <label for="chordAdherence">Chord adherence</label>
      <input type="range" id="chordAdherence" min="0" max="1" step="0.01" value="0.70" />
      <span class="slider-val" id="chordAdherenceVal">0.70</span>
    </div>
  </div>

  <div class="section">
    <h2>Perpetual Motion</h2>

    <div class="toggle-row">
      <input type="checkbox" id="perpetual" />
      <label for="perpetual">Uniform subdivision, no rests</label>
    </div>

    <div id="perpetualFields">
      <label for="noteValue">Note value</label>
      <select id="noteValue">
        <option value="eighth">Eighth notes</option>
        <option value="sixteenth">Sixteenth notes</option>
      </select>
    </div>
  </div>

  <button id="generate">Generate &amp; Download MIDI</button>
  <div id="output"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
